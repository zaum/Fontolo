[package]
name = "fontolo"
version = "0.3.58"
description = "Cross-platform font manager: preview, tag, activate/deactivate, and install fonts"
authors = ["zaum"]
license = "GPL-3.0-only"
homepage = "https://github.com/zaum/fontolo/"
repository = "https://github.com/zaum/fontolo"
edition = "2021"

[lib]
name = "fontolo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
walkdir = "2"
dirs = "6"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
notify = "7"
rodio = { version = "0.19", default-features = false }
# Keep a TLS backend even though the Affinity MCP socket is plain-HTTP
# loopback: reqwest without any TLS feature fails any https:// request at
# runtime, and rustls-platform-verifier uses the OS trust store on all three
# platforms. Cross-platform by design (pure Rust, no system OpenSSL needed).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Foundation"] }
